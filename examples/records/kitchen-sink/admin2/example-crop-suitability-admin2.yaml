# yaml-language-server: $schema=../../../spec/schemas/profiles/cdh.schema.json
#
# ============================================================================
# SAMPLE RECORD - NOT REAL DATA.
# The admin-2 aggregation of example-crop-suitability. It is a CHILD of that
# record through `parent` (standard.md section 4.8), because it has no standing
# on its own: nobody looks for these aggregates without knowing the product
# they came from. Its place in this subdirectory is filing only.
# Note what `parent` does NOT do - this record repeats its own license,
# contact, citation, spatial, and temporal, and sets its own `access`, because
# nothing is inherited from a parent. Nesting implies nothing either: the
# derivation is stated explicitly in processing[].derived_from.
# Aggregating a grid to polygons is lossy, which is why this is its own record
# rather than a second structure on the parent.
# ============================================================================
cdh_schema_version: "v0.4.0"
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.4.0/extensions/cdh/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.4.0/extensions/agriculture/schema.json

id: example-crop-suitability-admin2
parent: example-crop-suitability
title: "Example Crop Suitability, Admin-2 Aggregates (SAMPLE - NOT REAL DATA)"
version: "2.0"
# Same program grouping as its parent: a series is a facet, not the family.
series:
  name: Example Suitability Atlas
  url: https://example.org/atlas
description: >
  FICTIONAL SAMPLE RECORD. Area-weighted mean suitability from the gridded example crop suitability
  cube, aggregated to admin-2 units of the imaginary region of Farland, for the same crops,
  scenarios, and projection horizons. Delivered as one Parquet table keyed to an external boundary
  set - geometries are not embedded. Every value here is invented.
license: CC-BY-4.0
resource_type: dataset

# The grid is `access: restricted`; this aggregate is public. Every record
# states its own access conditions.

keywords:
  - suitability
  - admin aggregates
  - sample data

note: >
  Aggregation hides within-unit variation: a unit reported as Moderate can contain both unsuitable
  and highly suitable cells. Use the gridded parent record when that matters. Units follow the
  boundary record joined below; codes are stable within a release.

contact:
  - name: Ada Placeholder
    roles: [producer, point-of-contact]
    email: ada.placeholder@example.org
    organization: Institute for Example Data
    url: https://example.org
  - name: Jan Itor
    roles: [maintainer]
    email: jan.itor@example.org
    organization: Institute for Example Data
  - organization: Institute for Example Data
    roles: [licensor]
    url: https://example.org

citation:
  title: "Example Crop Suitability, Admin-2 Aggregates"
  authors:
    - family: Placeholder
      given: A.
  date: "2026"
  publisher: Example Data Repository
  url: https://example.org/atlas/example-crop-suitability-admin2

created: "2026-07-20"
updated: "2026-07-20"

spatial:
  bbox:
    - [10, -5, 22, 8]
    - [28, 6, 40, 20]
  geography:
    - africa
  crs: EPSG:4326
  # No resolution: the reporting unit is the adm2_code location dimension below.

temporal:
  start_date: "2030"
  end_date: "2050"

# The same axes as the grid, minus lat/lon: here they are table columns.
structures:
  - name: main
    dimensions:
      - name: adm0_code
        type: location
        description: Example country code of the reporting unit.
      - name: adm2_code
        type: location
        description: Example admin-2 unit of Farland, the reporting unit of every row.
        reference_system: https://example.org/boundaries/farland-2024
      - name: time
        type: temporal
        description: Projection horizon (reference year).
        values: ["2030", "2050"] # ISO 8601 strings; a temporal axis takes no bare numbers
        step: P20Y
      - name: crop
        type: crop
        description: Example crop code.
        reference_system: https://example.org/vocab/crop-codes
        values: [maiz, rice, whea]
      - name: scenario
        type: scenario
        description: Emissions scenario label.
        reference_system: https://example.org/vocab/scenarios
        values: [ssp245, ssp585]
    variables:
      - name: suitability_index_mean
        description: Area-weighted mean of the gridded suitability index over the reporting unit.
        data_type: float32
        unit: "1"
        note: Dimensionless index; do not sum across units.
      - name: cells_counted
        description: Number of grid cells with data inside the reporting unit.
        data_type: int32
        unit: "1"
        note: Low counts mean the mean rests on very few cells.
    foreign_keys:
      - fields: [adm0_code, adm2_code]
        reference:
          resource: https://example.org/data/example-farland-admin2-boundaries
          asset: boundaries
          fields: [ADM0_CODE, ADM2_CODE]

cdh:
  domain: [agricultural-production, adaptation]
  usage:
    not_recommended_for:
      - use: comparing units of very different size
        reason: a mean over a large unit hides variation a small unit cannot hide.
        use_instead: the gridded parent record.

commodities:
  - maize
  - rice
  - wheat

processing:
  # A shared parent implies nothing. The derivation is stated here.
  - id: source
    description: The gridded suitability cube described by the parent record.
    date: "2026-07-10"
    derived_from:
      # A Hub record is named by id, not URL.
      - id: example-crop-suitability
        title: Example Gridded Crop Suitability Projections
        version: "2.0" # pins the parent release this aggregate was computed from
  - id: zonal-aggregate
    description: >
      Area-weighted zonal mean of the gridded suitability cube over admin-2 units, one row per unit,
      crop, scenario, and horizon.
    code:
      url: https://example.org/code/cdh-pipeline
      version: "abc1234"
    date: "2026-07-18"

data:
  - name: table
    structures: [main]
    description: Admin-2 suitability aggregates, one Parquet table.
    locations:
      - url: https://example.org/data/example-crop-suitability/v2/admin2/suitability_admin2.parquet
        title: HTTPS
      - url: s3://example-bucket/example-crop-suitability/v2/admin2/suitability_admin2.parquet
        title: S3
    media_type: application/vnd.apache.parquet
    file_size: 12 MB
    processing_steps: [zonal-aggregate]

additional_assets:
  # The join is the thing a consumer needs and the table cannot carry.
  - name: join example
    description: Joins the table to the boundary record and maps mean suitability per admin-2 unit.
    locations:
      - url: https://example.org/data/example-crop-suitability/v2/admin2/join-admin2.ipynb
    media_type: application/vnd.jupyter
    roles: [example]
    file_size: 20 KB

additional_links:
  - title: Example Suitability Atlas
    rel: about
    url: https://example.org/atlas
    description: Landing page describing the fictional atlas and its methods.
