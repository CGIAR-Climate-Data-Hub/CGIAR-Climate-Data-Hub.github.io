funding:
  - name: Example Funding Programme
    url: https://example.org/funding

created: "2026-07-15"
updated: "2026-07-15"

spatial:
  # Disjoint coverage: two separate areas. No overall/union box is authored -
  # the encoder derives the overall extent when serializing to STAC.
  bbox:
    - [10, -5, 22, 8]
    - [28, 6, 40, 20]
  geography:
    - africa
  crs: EPSG:4326
  # geometry_column is intentionally omitted: it applies to vector tables, not
  # a gridded raster cube like this one.
  resolution:
    - type: xy
      unit: degree
      value: 0.05
      label: 3 arc-minutes (~5 km at equator)

temporal:
  # Coverage span (year precision). The two projection horizons are a temporal
  # axis, so they are declared as a type: temporal dimension below - not here.
  start_date: "2030"
  end_date: "2050"

# lat/lon come from spatial. Every other axis - the projection horizon (a temporal
# dimension, with an ISO 8601 step) and the domain axes - is declared here.
dimensions:
  - name: time
    type: temporal
    description: Projection horizon (reference year).
    # A regular axis gives [first, last] + step instead of listing every value.
    extent: ["2030", "2050"] # ISO 8601 strings; a temporal axis takes no bare numbers
    step: P20Y
  - name: crop
    type: crop
    description: Example crop code; the {crop} token.
    reference_system: https://example.org/vocab/crop-codes
    data_type: string
    # categories in place of values: the codes, labelled.
    categories:
      - { value: maiz, label: Maize }
      - { value: rice, label: Rice }
      - { value: whea, label: Wheat }
  - name: scenario
    type: scenario
    description: Emissions scenario label.
    reference_system: https://example.org/vocab/scenarios
    values: [ssp245, ssp585]

variables:
  - name: suitability_index
    description: Continuous modelled suitability, 0 (unsuitable) to 1 (optimal).
    data_type: float32
    unit: "1"
    note: Dimensionless index; do not sum across cells.
  - name: suitability_class
    description: Categorical suitability derived by binning suitability_index.
    data_type: uint8
    unit: "1"
    # This variable's fill value differs from the asset default (-9999, which no
    # uint8 can hold), so it states its own. The float variable above takes the
    # asset value.
    nodata: 255
    categories:
      - value: 0
        label: Unsuitable
        description: Modelled suitability below 0.25.
      - value: 1
        label: Marginal
        description: Modelled suitability 0.25 to 0.5.
      - value: 2
        label: Moderate
        description: Modelled suitability 0.5 to 0.75.
      - value: 3
        label: High
        description: Modelled suitability above 0.75.
  - name: cropland_mask
    description: Cells modelled as cropland; suitability is only meaningful where this is 1.
    data_type: uint8
    nodata: 255
    categories:
      - value: 0
        label: Not cropland
      - value: 1
        label: Cropland

# The mask varies over the grid only, so it cannot share the projection axes.
# Each structure groups variables with the same dimensions; every asset names
# the structures it holds.
structures:
  - name: projections
    dimensions: [time, crop, scenario]
    variables: [suitability_index, suitability_class]
  - name: static
    dimensions: []
    variables: [cropland_mask]

cdh:
  domain: [agricultural-production, adaptation]
  usage:
    # Illustrative, not exhaustive - absence excludes nothing, and a listed use is
    # not an endorsement for a given decision.
    intended_uses:
      - national and sub-national suitability screening
      - targeting of adaptation investment
    not_recommended_for:
      - use: field-scale planting decisions
        reason: the grid is far too coarse, and the data is fictional.
        use_instead: real, locally validated agronomic data.

climate:
  baseline:
    start_date: "1995-01-01"
    end_date: "2014-12-31"
  bias_adjustment:
    method: Example quantile mapping
    reference_dataset: Example reference climatology v1
  downscaling:
    method: Example statistical downscaling
    resolution: 0.05 degree
  mip_era: CMIP6
  models:
    - EXAMPLE-ESM1
    - EXAMPLE-ESM2
  scenarios:
    - ssp245
    - ssp585

commodities:
  - maize
  - rice
  - wheat

processing:
  - id: source
    description: Original suitability modelling run for the fictional Farland region.
    code:
      url: https://example.org/code/suitability-model
      version: v2.0.0
    date: "2026-06-01T00:00:00Z"
    derived_from:
      - url: https://example.org/data/example-climate-projections
        title: Example downscaled climate projections
        version: "3"
  - id: cloud-optimize
    description: Conversion of model output to a consolidated Zarr cube and COGs.
    code:
      url: https://example.org/code/cdh-pipeline
      version: "abc1234"
    date: "2026-07-10"

data:
  - name: zarr
    description: Zarr representation of the full suitability cube.
    locations:
      - url: https://example.org/data/example-crop-suitability/v2/cube.zarr
        title: HTTPS
      - url: s3://example-bucket/example-crop-suitability/v2/cube.zarr
        title: S3
    media_type: application/vnd.zarr; version=3
    nodata: -9999
    file_size: 250 MB
    processing_steps: [cloud-optimize]
    structures: [projections, static]
  # One NetCDF per disjoint area. data[].spatial gives each file's own coverage so
  # a client can pick one; checksum fits because each entry names a single file.
  - name: netcdf-west
    description: The full cube clipped to western Farland, one NetCDF file.
    locations:
      - url: https://example.org/data/example-crop-suitability/v2/farland-west.nc
    media_type: application/x-netcdf
    nodata: -9999
    file_size: 90 MB
    checksum: sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
    spatial:
      bbox: [10, -5, 22, 8]
    processing_steps: [cloud-optimize]
    structures: [projections, static]
  - name: netcdf-east
    description: The full cube clipped to eastern Farland, one NetCDF file.
    locations:
      - url: https://example.org/data/example-crop-suitability/v2/farland-east.nc
    media_type: application/x-netcdf
    nodata: -9999
    file_size: 160 MB
    checksum: sha256:60303ae22b998861bce3b28f33eec1be758a213c86c93c076dbe9f558c11c752
    spatial:
      bbox: [28, 6, 40, 20]
    processing_steps: [cloud-optimize]
    structures: [projections, static]
  - name: cogs
    description: Per-slice Cloud Optimized GeoTIFFs, one file per scenario/crop/variable.
    locations:
      - url: https://example.org/data/example-crop-suitability/v2/cogs/
        title: HTTPS
      - url: s3://example-bucket/example-crop-suitability/v2/cogs/
        title: S3
    href_template: "suit_{scenario}_{crop}_{variable}.tif"
    media_type: "image/tiff; application=geotiff; profile=cloud-optimized"
    nodata: -9999
    file_size: 3 MB
    processing_steps: [cloud-optimize]
    structures: [projections]

additional_assets:
