order: 2
label: Edit a wiki page
icon: WIKI
title: Edit a wiki page
intro: >
  Wikis are Markdown files under src/content/wikis/ in the site repo. Edits go through
  normal pull requests, so every change is reviewed, versioned and attributable.
audience: Anyone
steps:
  - title: Find the page in the repo
    body: >
      Every wiki page ends with an 'Edit this page on GitHub' link that opens its source file.
      To add a page, copy the front-matter of an existing one and set its group (The Hub,
      Data standards, Methods, Concepts or Reference).
  - title: Open a PR with your edit
    body: >
      Fork or branch, edit the Markdown, bump the updated date in the front-matter, and open a
      pull request. CI checks formatting and builds the site; a broken link or front-matter
      field fails the build. To see the page, run the site locally with bun run dev.
  - title: Request review
    body: >
      One suitable reviewer approves wiki changes; you cannot approve your own. Mention in the
      PR what changed and why, and ask a Hub maintainer if you are not sure who should review.
    link:
      label: "Governance: review process"
      href: /wikis/governance/#review-process
checklist:
  - Front-matter (title, description, group, updated) is correct.
  - Internal links resolve and external links are correct.
  - Code blocks specify a language for syntax highlighting.
  - Images include alt text.
