order: 3
title: Write a tutorial
intro: >
  Tutorials are runnable, step-by-step guides to working with Hub data. They can be
  written as Markdown or contributed as an executed Jupyter notebook — both render
  the same way on the site, with styled prose, highlighted code, and saved outputs.
steps:
  - title: Pick a format
    body: >
      Markdown (.md) suits prose-led guides; a Jupyter notebook (.ipynb) suits
      analysis-led ones — commit it executed, and saved outputs (plots, tables,
      dataset previews) render right in the page. Either file goes in
      src/content/tutorials/, and the filename becomes the URL, so keep it a short
      lowercase slug.
    link:
      label: "Example: Getting started with the Hub"
      href: /tutorials/getting-started/
  - title: Add the tutorial metadata
    body: >
      Markdown files take YAML front-matter. Notebooks carry the same fields in
      their notebook metadata under a "cdh" key (in JupyterLab, edit it via the
      Property Inspector → Advanced Tools). Outcomes are the "you'll be able to"
      bullets shown on the tutorial card.
    lang: json
    code: |
      {
        "cdh": {
          "title": "Tropical Livestock Units from GLW4",
          "description": "Compute TLU from GLW4 species densities.",
          "audience": "Python & R",
          "topic": "Livestock",
          "time": "15 min",
          "updated": "2026-07-10",
          "outcomes": ["Stream GLW4 densities from the Zarr store"],
          "datasets": ["glw4-2020"]
        }
      }
  - title: Link the data you use
    body: >
      List the catalog record ids your tutorial works with in "datasets". The site
      cross-links both ways — your tutorial shows the records it uses, and each
      record page lists tutorials that use it.
  - title: Keep outputs static and the notebook runnable
    body: >
      Matplotlib figures, pandas tables and xarray previews all render on the site.
      Interactive outputs (Plotly, ipywidgets) don't — clear them, or talk to us
      about publishing that tutorial as an exported HTML page instead. Notebook
      pages also offer an 'Open in Colab' link, so the notebook must run from a
      clean session: install what it needs and stream data from Hub endpoints.
  - title: Open a PR and request review
    body: >
      Fork or branch, add your file, and open a pull request. CI builds the site,
      so missing metadata fails the check; run bun run dev to see the page locally.
      One suitable reviewer approves tutorials; you cannot approve your own.
    link:
      label: "Governance: review process"
      href: /wikis/governance/#review-process
checklist:
  - Filename is a short lowercase slug (it becomes the URL and the notebook download link).
  - Metadata is complete (title, description, audience, topic, time, updated, outcomes).
  - Data is streamed from Hub endpoints, not bundled or downloaded ahead.
  - The notebook is committed executed, with only the outputs that teach.
  - Section headings (##) are present so the page gets a table of contents.
  - Linked dataset ids in "datasets" match catalog record ids.
